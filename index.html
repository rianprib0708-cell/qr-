<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Surprise</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

/* MATRIX */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}

/* TEXT TENGAH (COUNTDOWN) */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 150px; /* BESAR BANGET */
  color: #ff4d88;
  font-weight: bold;
  text-shadow: 0 0 20px #ff4d88, 0 0 40px #ff4d88;
}

/* HAPPY BIRTHDAY */
.birthday {
  font-size: 60px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div class="center" id="text">3</div>

<script>
// ===== MATRIX =====
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01❤️".split("");
let fontSize = 18;
let columns = canvas.width / fontSize;
let drops = [];

for (let i = 0; i < columns; i++) {
  drops[i] = 1;
}

function draw() {
  // BACKGROUND transparan (biar trail lebih jelas)
  ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // WARNA RAIN (LEBIH TERANG)
  ctx.fillStyle = "#ff2d75";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) {
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw, 40);

// ===== COUNTDOWN =====
let count = 3;
let el = document.getElementById("text");

let timer = setInterval(() => {
  el.innerText = count;
  count--;

  if (count < 0) {
    clearInterval(timer);

    el.innerText = "Happy Birthday 🎉";
    el.classList.add("birthday");

    // DELAY LEBIH LAMA
    setTimeout(() => {
      el.style.display = "none";
      // nanti lanjut ke slider kamu
    }, 3000);
  }
}, 1500); // DELAY ANGKA LEBIH LAMA
</script>

</body>
</html>
