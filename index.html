 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jangan ngambek lagi ya</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: black;
}

/* MATRIX */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}

/* ⭐ BINTANG BARU (LEBIH HIDUP) */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #000 60%, #020010 100%);
  overflow: hidden;
  display: none;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 6px white;
  animation: twinkle 2s infinite ease-in-out;
}

@keyframes twinkle {
  0%,100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

/* 🌠 BINTANG JATUH */
.shooting {
  position: absolute;
  width: 2px;
  height: 80px;
  background: linear-gradient(white, transparent);
  opacity: 0.8;
  transform: rotate(45deg);
  animation: shoot 1s linear forwards;
}

@keyframes shoot {
  from {
    transform: translate(0,0) rotate(45deg);
    opacity: 1;
  }
  to {
    transform: translate(300px,300px) rotate(45deg);
    opacity: 0;
  }
}

/* COUNTDOWN */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 150px;
  color: #ff4d88;
  font-weight: bold;
  text-shadow: 0 0 20px #ff4d88, 0 0 40px #ff4d88;
}

/* SLIDER */
.slider {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  overflow: hidden;
}

.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.5s ease;
}

.slide {
  min-width: 100%;
  text-align: center;
  padding-top: 60px;
}

.slide img {
  width: 80%;
  max-height: 400px;
  border-radius: 20px;
}

.caption {
  font-size: 22px;
  color: pink;
  margin-bottom: 20px;
}
</style>
</head>

<body>

<audio id="music" autoplay loop>
  <source src="https://files.catbox.moe/nym68k.mp3" type="audio/mpeg">
</audio>

<canvas id="canvas"></canvas>
<div class="stars" id="stars"></div>

<div class="center" id="text">3</div>

<div class="slider" id="slider">
  <div class="slides" id="slides">

    <div class="slide">
      <div class="caption">my istri gwh ❤️</div>
      <img src="https://ibb.co.com/ds9pgzTs">
    </div>

    <div class="slide">
      <div class="caption">my embege kiyut bngt loh ya 😍</div>
      <img src="https://ibb.co.com/GfGS97LP">
    </div>

    <div class="slide">
      <div class="caption">my kisah ❤️</div>
      <img src="https://ibb.co.com/xt148SCn">
    </div>

  </div>
</div>

<script>
// MUSIC
let music = document.getElementById("music");
window.addEventListener("load", () => {
  music.play().catch(() => {
    document.addEventListener("click", () => music.play(), { once: true });
  });
});

// MATRIX
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01❤️".split("");
let fontSize = 18;
let columns = canvas.width / fontSize;
let drops = [];

for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ff2d75";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.95) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(draw, 40);

// COUNTDOWN
let count = 3;
let el = document.getElementById("text");

let timer = setInterval(() => {
  el.innerText = count;
  count--;

  if (count < 0) {
    clearInterval(timer);

    el.innerText = "from rian to ida";

    setTimeout(() => {
      el.style.display = "none";
      document.getElementById("canvas").style.display = "none";

      let stars = document.getElementById("stars");
      stars.style.display = "block";

      // ⭐ BINTANG HIDUP
      for (let i = 0; i < 120; i++) {
        let s = document.createElement("div");
        s.className = "star";

        let size = Math.random() * 3 + 1;
        s.style.width = size + "px";
        s.style.height = size + "px";

        s.style.top = Math.random() * 100 + "%";
        s.style.left = Math.random() * 100 + "%";

        s.style.animationDuration = (Math.random() * 2 + 1) + "s";

        stars.appendChild(s);
      }

      // 🌠 SHOOTING STAR
      setInterval(() => {
        let shoot = document.createElement("div");
        shoot.className = "shooting";

        shoot.style.top = Math.random() * 50 + "%";
        shoot.style.left = Math.random() * 50 + "%";

        stars.appendChild(shoot);

        setTimeout(() => shoot.remove(), 1000);
      }, 2000);

      document.getElementById("slider").style.display = "block";
    }, 3000);
  }
}, 1500);

// SWIPE
let slides = document.getElementById("slides");
let index = 0;
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (startX - endX > 50) index++;
  else if (endX - startX > 50) index--;

  if (index < 0) index = 0;
  if (index > 2) index = 2;

  slides.style.transform = "translateX(-" + index * 100 + "%)";
});
</script>

</body>
</html>
