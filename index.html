<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jangan ngambek lagi ya</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: sans-serif;
}

/* MATRIX CANVAS */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* GALAXY */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  display: none;
  overflow: hidden;
  background: radial-gradient(circle, #020010, #000);
  z-index: 1;
}

/* BINTANG */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite ease-in-out;
}

@keyframes twinkle {
  0%,100% {opacity: 0.2; transform: scale(0.8);}
  50% {opacity: 1; transform: scale(1.3);}
}

/* SHOOTING STAR (UPGRADE) */
.shooting {
  position: absolute;
  width: 2px;
  height: 200px;
  background: linear-gradient(white, #ff69b4, transparent);
  box-shadow: 0 0 20px white, 0 0 40px #ff69b4;
  transform: rotate(45deg);
  animation: shoot 1.2s linear forwards;
}

@keyframes shoot {
  0% {
    transform: translate(0,0) rotate(45deg);
    opacity: 1;
  }
  100% {
    transform: translate(1000px,1000px) rotate(45deg);
    opacity: 0;
  }
}

/* TEXT */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 120px;
  color: #ff4d88;
  z-index: 2;
  text-align: center;
}

/* SLIDER */
.slider {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 2;
}

.slides {
  display: flex;
  transition: transform 0.5s ease;
}

.slide {
  min-width: 100%;
  text-align: center;
  padding-top: 60px;
}

.slide img {
  width: 80%;
  border-radius: 20px;
}

.caption {
  color: pink;
  font-size: 20px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<audio id="music" autoplay loop muted>
  <source src="https://files.catbox.moe/nym68k.mp3">
</audio>

<canvas id="canvas"></canvas>
<div class="stars" id="stars"></div>

<div class="center" id="text">3</div>

<div class="slider" id="slider">
  <div class="slides" id="slides">

    <div class="slide">
      <div class="caption">my istri gwh🤭👅</div>
      <img src="https://ibb.co.com/DP2NbQ7W">
    </div>

    <div class="slide">
      <div class="caption">my embege kiyut😏</div>
      <img src="https://ibb.co.com/0p7QYMrj">
    </div>

    <div class="slide">
      <div class="caption">ini yg kalo ngambek bisa setahun😡</div>
      <img src="https://ibb.co.com/q3xYnnLg">
    </div>

  </div>
</div>

<script>
// FIX AUTOPLAY SOUND
window.addEventListener("click", () => {
  let audio = document.getElementById("music");
  audio.muted = false;
  audio.play();
});

// COUNTDOWN
let count = 3;
let el = document.getElementById("text");

let timer = setInterval(() => {
  el.innerText = count;
  count--;

  if (count < 0) {
    clearInterval(timer);

    el.innerText = "Happy Birthday 🎉";

    setTimeout(() => {
      el.style.display = "none";
      document.getElementById("canvas").style.display = "none";

      let stars = document.getElementById("stars");
      stars.style.display = "block";

      // generate stars
      for (let i = 0; i < 120; i++) {
        let s = document.createElement("div");
        s.className = "star";
        let size = Math.random()*3 + 1;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.top = Math.random()*100+"%";
        s.style.left = Math.random()*100+"%";
        stars.appendChild(s);
      }

      // shooting star (lebih smooth)
      setInterval(() => {
        let shoot = document.createElement("div");
        shoot.className = "shooting";

        shoot.style.top = Math.random()*200+"px";
        shoot.style.left = Math.random()*window.innerWidth+"px";

        stars.appendChild(shoot);
        setTimeout(()=>shoot.remove(),1200);
      }, 1200);

      document.getElementById("slider").style.display = "block";

    }, 3000);
  }
}, 1200);

// SWIPE FIX
let slides = document.getElementById("slides");
let index = 0;
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  let diff = startX - endX;

  if (diff > 50) index++;
  else if (diff < -50) index--;

  index = Math.max(0, Math.min(index, 2));
  slides.style.transform = "translateX(-" + index * 100 + "%)";
});
</script>

</body>
</html>
