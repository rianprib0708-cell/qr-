<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Surprise</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: black;
  color: white;
}

/* MATRIX */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}

/* CENTER TEXT */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 80px;
  color: pink;
  text-align: center;
}

/* SLIDER */
.slider {
  display: none;
  position: absolute;
  width: 100%;
  height: 100%;
  background: black;
}

.slide {
  display: none;
  text-align: center;
  padding-top: 80px;
}

.slide img {
  width: 80%;
  max-height: 400px;
  border-radius: 20px;
}

.caption {
  margin-top: 20px;
  font-size: 20px;
  color: pink;
}

/* BUTTON */
.btn {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  background: pink;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="center" id="text">3</div>

<div class="slider" id="slider">
  <div class="slide">
    <img src="https://via.placeholder.com/300">
    <div class="caption">Aku sayang kamu ❤️</div>
  </div>

  <div class="slide">
    <img src="https://via.placeholder.com/300">
    <div class="caption">Semoga panjang umur 🎂</div>
  </div>

  <div class="slide">
    <img src="https://via.placeholder.com/300">
    <div class="caption">Selalu sama aku ya 💕</div>
  </div>

  <button class="btn" onclick="nextSlide()">Next</button>
</div>

<script>
// MATRIX EFFECT
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01❤️".split("");
let fontSize = 14;
let columns = canvas.width / fontSize;
let drops = [];

for (let i = 0; i < columns; i++) drops[i] = 1;

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#ff4d88";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    let text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}
setInterval(draw, 33);

// COUNTDOWN
let count = 3;
let text = document.getElementById("text");

let timer = setInterval(() => {
  count--;
  text.innerText = count;

  if (count == 0) {
    text.innerText = "Happy Birthday 🎉";
  }

  if (count < 0) {
    clearInterval(timer);
    text.style.display = "none";
    document.getElementById("slider").style.display = "block";
    showSlide(0);
  }
}, 1000);

// SLIDER
let current = 0;
let slides = document.getElementsByClassName("slide");

function showSlide(n) {
  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  slides[n].style.display = "block";
}

function nextSlide() {
  current++;
  if (current >= slides.length) current = 0;
  showSlide(current);
}
</script>

</body>
  </html>
