<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jangan ngambek lagi ya</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: sans-serif;
}

/* MATRIX */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* GALAXY */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  display: none;
  overflow: hidden;
  background: radial-gradient(circle, #020010, #000);
  z-index: 1;
}

/* BINTANG */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 6px white;
  animation: twinkle infinite;
}

@keyframes twinkle {
  0%,100% {opacity: 0.3;}
  50% {opacity: 1;}
}

/* SHOOTING STAR */
.shooting {
  position: absolute;
  width: 3px;
  height: 140px;
  background: linear-gradient(white, #ff69b4, transparent);
  box-shadow: 0 0 20px white;
  transform: rotate(45deg);
  animation: shoot 1s linear forwards;
}

@keyframes shoot {
  from {transform: translate(0,0) rotate(45deg); opacity:1;}
  to {transform: translate(800px,800px) rotate(45deg); opacity:0;}
}

/* TEXT */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 150px;
  color: #ff4d88;
  z-index: 2;
}

/* SLIDER */
.slider {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  z-index: 2;
}

.slides {
  display: flex;
  transition: transform 0.5s;
}

.slide {
  min-width: 100%;
  text-align: center;
  padding-top: 60px;
}

.slide img {
  width: 80%;
  border-radius: 20px;
}

.caption {
  color: pink;
}
</style>
</head>

<body>

<audio id="music" autoplay loop>
  <source src="https://files.catbox.moe/nym68k.mp3">
</audio>

<canvas id="canvas"></canvas>
<div class="stars" id="stars"></div>

<div class="center" id="text">3</div>

<div class="slider" id="slider">
  <div class="slides" id="slides">

    <div class="slide">
      <div class="caption">my istri gwh ❤️</div>
      <img src="https://picsum.photos/300/200?1">
    </div>

    <div class="slide">
      <div class="caption">my embege kiyut 😍</div>
      <img src="https://picsum.photos/300/200?2">
    </div>

    <div class="slide">
      <div class="caption">jangan ngambek lama 😡</div>
      <img src="https://picsum.photos/300/200?3">
    </div>

  </div>
</div>

<script>
// COUNTDOWN
let count = 3;
let el = document.getElementById("text");

let timer = setInterval(() => {
  el.innerText = count;
  count--;

  if (count < 0) {
    clearInterval(timer);

    el.innerText = "Happy Birthday 🎉";

    setTimeout(() => {
      el.style.display = "none";
      document.getElementById("canvas").style.display = "none";

      let stars = document.getElementById("stars");
      stars.style.display = "block";

      // generate stars
      for (let i = 0; i < 100; i++) {
        let s = document.createElement("div");
        s.className = "star";
        s.style.top = Math.random()*100+"%";
        s.style.left = Math.random()*100+"%";
        s.style.width = s.style.height = Math.random()*3+"px";
        stars.appendChild(s);
      }

      // shooting star
      setInterval(() => {
        let shoot = document.createElement("div");
        shoot.className = "shooting";
        shoot.style.top = Math.random()*200+"px";
        shoot.style.left = Math.random()*window.innerWidth+"px";
        stars.appendChild(shoot);
        setTimeout(()=>shoot.remove(),1000);
      },1500);

      document.getElementById("slider").style.display = "block";

    }, 3000);
  }
}, 1500);

// SWIPE
let slides = document.getElementById("slides");
let index = 0;
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if (startX - endX > 50) index++;
  else if (endX - startX > 50) index--;

  index = Math.max(0, Math.min(index, 2));
  slides.style.transform = "translateX(-" + index * 100 + "%)";
});
</script>

</body>
</html>
